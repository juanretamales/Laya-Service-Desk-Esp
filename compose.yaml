services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    user: "10001:10001"
    volumes:
      - .:/workspace
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    command: ["python", "-m", "pytest", "-q"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # No privileged, no host docker socket, no GPU or CUDA configuration.
